[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xlistener"
version = "0.1.0"
description = "Local X account listener with Ollama classification and Telegram notifications"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "keyring>=25,<26",
    "ollama>=0.4,<1",
    "Pillow>=10,<13",
    "playwright>=1.48,<2",
    "pystray>=0.19,<1",
    "pydantic>=2.8,<3",
    "PyYAML>=6,<7",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
]
media = [
    "faster-whisper>=1.2,<2",
]

[project.scripts]
xlistener = "xlistener.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
